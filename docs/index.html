<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="description" content="Trice — a blocky grid puzzle. Fit three-square pieces, clear rows and columns, chase the combo.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23050505'/%3E%3Crect x='13' y='13' width='19' height='19' fill='%23ff4136'/%3E%3Crect x='13' y='32' width='19' height='19' fill='%230a84ff'/%3E%3Crect x='32' y='32' width='19' height='19' fill='%23ffd60a'/%3E%3C/svg%3E">
<title>Trice</title>
<style>
  :root{ --u: calc(min(92vw, 620px) / 20); }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:#050505; color:#e8e8e8;
    font-family:"Courier New", ui-monospace, monospace;}
  body{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:12vw 6vw calc(12vw + env(safe-area-inset-bottom)); gap:calc(var(--u)*1.4);}
  .mark{width:calc(var(--u)*7); height:calc(var(--u)*7);}
  h1{font-size:calc(var(--u)*3); letter-spacing:calc(var(--u)*0.5);}
  .pitch{font-size:calc(var(--u)*0.95); line-height:1.7; color:#c8c8c8; max-width:32ch;}
  .links{display:flex; flex-direction:column; gap:calc(var(--u)*0.5); align-items:center;}
  .badge{font-size:calc(var(--u)*0.8); letter-spacing:2px; color:#8a8a8a;
    border:2px solid #333; padding:calc(var(--u)*0.5) calc(var(--u)*1); text-transform:uppercase;}
  a{color:#28c840; text-decoration:none;}
  a.btn{border:2px solid #28c840; padding:calc(var(--u)*0.5) calc(var(--u)*1);
    font-weight:700; letter-spacing:2px; font-size:calc(var(--u)*0.85);}
  a:hover{text-decoration:underline;}
  .foot{font-size:calc(var(--u)*0.7); color:#6a6a6a; letter-spacing:1px; line-height:1.9;}
</style>
</head>
<body>
  <svg class="mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <rect x="13" y="13" width="19" height="19" fill="#ff4136"/>
    <rect x="13" y="13" width="19" height="3" fill="#fff" opacity="0.3"/>
    <rect x="13" y="32" width="19" height="19" fill="#0a84ff"/>
    <rect x="13" y="32" width="19" height="3" fill="#fff" opacity="0.3"/>
    <rect x="32" y="32" width="19" height="19" fill="#ffd60a"/>
    <rect x="32" y="32" width="19" height="3" fill="#fff" opacity="0.3"/>
  </svg>

  <h1>TRICE</h1>

  <p class="pitch">A blocky grid puzzle. Fit three-square pieces onto a 6&times;6 grid,
  clear full rows and columns, chase the combo.</p>

  <div class="links">
    <span class="badge">Coming soon</span>
    <!-- once live, replace the badge with real links, e.g.:
    <a class="btn" href="PLAY_URL">Play in your browser</a>
    <a href="APPSTORE_URL">App&nbsp;Store</a>
    <a href="PLAY_URL">Google&nbsp;Play</a>
    -->
  </div>

  <p class="foot">
    <a href="privacy.html">Privacy&nbsp;Policy</a><br>
    <a href="mailto:lrmtechgames@gmail.com">lrmtechgames@gmail.com</a><br>
    &copy; 2026 LRM Tech Games
  </p>
</body>
</html>
